<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8ff7"/>
      <stop offset="1" stop-color="#3561d6"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eefc"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <!-- clipboard board -->
  <rect x="30" y="24" width="68" height="84" rx="10" fill="url(#board)"/>
  <!-- clip -->
  <rect x="47" y="17" width="34" height="16" rx="6" fill="#1f3f99"/>
  <rect x="55" y="13" width="18" height="9" rx="4.5" fill="#1f3f99"/>
  <!-- the "shelf": stacked clipboard entries -->
  <rect x="40" y="46" width="48" height="12" rx="4" fill="#4f8ff7"/>
  <rect x="40" y="64" width="48" height="12" rx="4" fill="#9ab9f9"/>
  <rect x="40" y="82" width="48" height="12" rx="4" fill="#c9d9fb"/>
</svg>
