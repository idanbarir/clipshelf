name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    # Built on the oldest supported Ubuntu so the binary runs on newer ones too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Build the .deb package
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --locked
          echo "DEB=$(ls target/debian/*.deb)" >> "$GITHUB_ENV"
      - name: Package
        run: |
          name=clipshelf-v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-linux-x86_64
          mkdir -p "$name/data"
          cp target/release/clipshelf install.sh uninstall.sh README.md LICENSE "$name/"
          cp -r data/* "$name/data/"
          tar czf "$name.tar.gz" "$name"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: clipshelf-linux-x86_64
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.DEB }}
      # A new version number in Cargo.toml on main publishes a release
      # (tag v<version>) with the archive and the .deb attached.
      - name: Check for a new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "NEW_TAG=v$v" >> "$GITHUB_ENV"
          fi
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || env.NEW_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG || github.ref_name }}
          name: ClipShelf ${{ env.NEW_TAG || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.DEB }}
          generate_release_notes: true
