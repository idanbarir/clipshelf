[package]
name = "clipshelf"
version = "0.10.0"
edition = "2021"
license = "MIT"
description = "A simple Windows-style (Super+V) clipboard history for Linux, with images"
readme = "README.md"
authors = ["Idan Barir <idanbarir@gmail.com>"]
homepage = "https://github.com/idanbarir/clipshelf"
repository = "https://github.com/idanbarir/clipshelf"
keywords = ["clipboard", "linux", "gtk4", "clipboard-manager"]
categories = ["gui"]

[dependencies]
gtk = { version = "0.9", package = "gtk4", features = ["v4_6"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
x11rb = { version = "0.13", features = ["xfixes", "xtest"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
gdk4-x11 = "0.9"

[profile.release]
lto = true
strip = true
codegen-units = 1

[package.metadata.deb]
name = "clipshelf"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
ClipShelf remembers the text and images you copy and brings them back with \
Super+V, like the clipboard history on Windows. Click an item to paste it \
into the window you were using."""
maintainer-scripts = "debian/"
assets = [
  ["target/release/clipshelf", "usr/bin/", "755"],
  ["data/clipshelf.desktop", "usr/share/applications/io.github.idanbarir.ClipShelf.desktop", "644"],
  ["data/icons/io.github.idanbarir.ClipShelf.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["data/icons/io.github.idanbarir.ClipShelf-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
  ["data/io.github.idanbarir.ClipShelf.metainfo.xml", "usr/share/metainfo/", "644"],
  ["data/linux/70-clipshelf-uinput.rules", "usr/lib/udev/rules.d/", "644"],
  ["data/linux/clipshelf-uinput.conf", "usr/lib/modules-load.d/", "644"],
  ["README.md", "usr/share/doc/clipshelf/", "644"],
]
